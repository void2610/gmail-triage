[project]
name = "gmail-triage"
version = "0.1.0"
description = "Gmail トリアージ自動化 - Jev でメールを分類し、不要メール削除・重要メール Discord 通知"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "python-dotenv",
    "typesafe-sdk>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
gmail-triage = "gmail_triage:main"

[tool.pytest.ini_options]
pythonpath = ["."]
