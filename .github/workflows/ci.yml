name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 依存インストール
        run: uv sync --locked

      - name: pytest
        run: uv run pytest -q

      - name: フォーマット確認
        run: uv run ruff format --check jev_classifier.py claude_cli.py tests/
